name: fiscalkit

# GitHub only runs workflows found in .github/workflows at the repository root,
# so fiscalkit/.github/workflows/ci.yml never fires while the project lives in a
# subdirectory. That copy is the one the project keeps once it is extracted into
# its own repository; this one verifies it in the meantime.
#
# Path-filtered so ordinary profile README edits do not trigger a Python matrix.

on:
  push:
    branches: [main]
    paths:
      - "fiscalkit/**"
      - ".github/workflows/fiscalkit.yml"
  pull_request:
    paths:
      - "fiscalkit/**"
      - ".github/workflows/fiscalkit.yml"

defaults:
  run:
    working-directory: fiscalkit

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the optional MCP extra
        run: pip install -e '.[dev,mcp]'
      - name: Test
        run: pytest

  test-without-mcp:
    name: tests (no mcp extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The MCP server is optional. The library, its tests and the CLI must all
      # work when it is absent, which the matrix above cannot show.
      - name: Install core only
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Types without the optional dependency
        run: mypy src/fiscalkit
      - name: CLI works without the optional dependency
        run: |
          python -m fiscalkit.cli chave 43240311222333000181550010000001231000000010
          python -m fiscalkit.cli cnpj 12ABC34501DE35

  quality:
    name: lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev,mcp]'
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy src/fiscalkit

  package:
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install the wheel into a clean environment and use it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheeltest/bin/python -c "from fiscalkit import *; import fiscalkit; assert len(fiscalkit.__all__) > 30"
          /tmp/wheeltest/bin/fiscalkit cnpj 12ABC34501DE35
